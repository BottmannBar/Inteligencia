name: Atualizar dados de inteligencia

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atualizar-dados.yml'
      - 'scripts/atualizar_dados.py'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: atualizar-dados-inteligencia
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consultar IBGE e noticias RSS
        run: python scripts/atualizar_dados.py
      - name: Gravar dados gerados no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/painel.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar indicadores e noticias do painel"
            # Atualiza o branch antes de enviar: outros commits podem ter ocorrido durante a coleta.
            for tentativa in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Dados publicados com sucesso."
                exit 0
              fi
              sleep 3
            done
            echo "Nao foi possivel publicar os dados apos 3 tentativas."
            exit 1
          else
            echo "Nenhuma alteracao nos dados."
          fi
